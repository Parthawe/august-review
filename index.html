const gate=document.querySelector('#gate'),review=document.querySelector('#review'),form=document.querySelector('form'),input=document.querySelector('#password'),status=document.querySelector('#status'),button=form.querySelector('button[type=submit]'),frame=document.querySelector('iframe');let pdfUrl,brandUrl,brandPdfUrl,unlocked=false;const reveal=document.querySelector('#reveal');reveal.addEventListener('click',()=>{const show=input.type==='password';input.type=show?'text':'password';reveal.textContent=show?'Hide':'Show';reveal.setAttribute('aria-label',show?'Hide password':'Show password');reveal.setAttribute('aria-pressed',String(show));});input.addEventListener('input',()=>{input.removeAttribute('aria-invalid');status.textContent='';});
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
form.addEventListener('submit',async e=>{e.preventDefault();if(button.disabled)return;button.disabled=true;input.removeAttribute('aria-invalid');status.textContent='Opening review…';button.textContent='Opening…';let stage='download';const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),20000);try{
 if(!crypto.subtle||!window.DecompressionStream)throw Error('browser');
 const r=await fetch('review.enc.json',{cache:'no-store',signal:controller.signal});if(!r.ok)throw Error('network');const data=await r.json();clearTimeout(timeout);stage='decrypt';
 const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(data.salt),iterations:data.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
 const decrypted=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(data.iv)},key,bytes(data.ciphertext));stage='render';const unpack=new Blob([decrypted]).stream().pipeThrough(new DecompressionStream('gzip'));const content=JSON.parse(await new Response(unpack).text());
 const ready=new Promise((resolve,reject)=>{const loadTimeout=setTimeout(()=>reject(Error('render-timeout')),10000);frame.onload=()=>{frame.contentDocument.fonts.ready.then(()=>{clearTimeout(loadTimeout);resolve();},()=>{clearTimeout(loadTimeout);resolve();});};});frame.srcdoc=content.html;pdfUrl=URL.createObjectURL(new Blob([bytes(content.pdf)],{type:'application/pdf'}));document.querySelector('#pdf').href=pdfUrl;brandUrl=URL.createObjectURL(new Blob([content.brand],{type:'text/html'}));brandPdfUrl=URL.createObjectURL(new Blob([bytes(content.brandPdf)],{type:'application/pdf'}));document.querySelector('#brand').href=brandUrl;document.querySelector('#brandpdf').href=brandPdfUrl;input.value='';input.type='password';reveal.textContent='Show';reveal.setAttribute('aria-label','Show password');reveal.setAttribute('aria-pressed','false');await ready;const guideLink=frame.contentDocument.querySelector?.('.brand-guide-link');if(guideLink)guideLink.href=brandUrl;status.textContent='';gate.hidden=true;review.hidden=false;unlocked=true;frame.contentWindow.postMessage({type:'august-init',slide:requestedSlide(),reading:false},'*');frame.focus();
 }catch(error){unlocked=false;frame.removeAttribute('srcdoc');for(const url of [brandUrl,brandPdfUrl])if(url)URL.revokeObjectURL(url);for(const id of ['#brand','#brandpdf'])document.querySelector(id).removeAttribute('href');if(pdfUrl){URL.revokeObjectURL(pdfUrl);pdfUrl=null;}document.querySelector('#pdf').removeAttribute('href');status.textContent=error.name==='AbortError'?'The connection took too long. Check your connection and try again.':error.message==='browser'?'Please use a recent version of Safari, Chrome, Edge or Firefox.':stage==='decrypt'?'That password didn’t open the review. Check it and try again.':'The review could not load. Please check your connection and try again.';input.setAttribute('aria-invalid',String(stage==='decrypt'));input.focus();}finally{clearTimeout(timeout);button.disabled=false;button.textContent='Open review';}});
document.querySelector('#lock').addEventListener('click',()=>{unlocked=false;frame.removeAttribute('srcdoc');for(const url of [brandUrl,brandPdfUrl])if(url)URL.revokeObjectURL(url);for(const id of ['#brand','#brandpdf'])document.querySelector(id).removeAttribute('href');if(pdfUrl)URL.revokeObjectURL(pdfUrl);document.querySelector('#pdf').removeAttribute('href');review.hidden=true;gate.hidden=false;input.focus();});

function requestedSlide(){const n=Number(location.hash.slice(1));return Number.isInteger(n)&&n>=1&&n<=7?n:1;}
window.addEventListener('message',e=>{const d=e.data;if(!unlocked||e.source!==frame.contentWindow||!d||d.type!=='august-slide'||!Number.isInteger(d.slide)||d.slide<1||d.slide>7)return;history.replaceState(null,'','#'+d.slide);});
window.addEventListener('hashchange',()=>{if(unlocked)frame.contentWindow.postMessage({type:'august-go',slide:requestedSlide()},'*');});
</script></body></html>
