<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>August · Private review</title><style>
*{box-sizing:border-box}body{margin:0;background:#202123;color:#f7f7f4;font-family:system-ui,-apple-system,sans-serif}main{min-height:100dvh;display:grid;align-items:center;padding:32px}form{width:min(100%,440px);margin:auto}small{color:#bfe5d0;font-size:14px;letter-spacing:.08em}h1{font-weight:400;font-size:clamp(36px,6vw,54px);letter-spacing:-.045em;line-height:1.05;margin:26px 0 20px}p{font-size:16px;line-height:1.6;color:#bac3bd}label{display:block;font-size:14px;margin:32px 0 10px}input{width:100%;border:1px solid #68766c;border-radius:6px;background:#303b36;color:#fff;font-size:18px;padding:14px}button,a{font:inherit}button{cursor:pointer;border:0;border-radius:6px;padding:15px 20px;font-weight:600;background:#bfe5d0;color:#202123}form button{width:100%;margin-top:14px}button:disabled{opacity:.6;cursor:wait}:focus-visible{outline:3px solid #bfe5d0;outline-offset:4px}#status{min-height:48px;font-size:14px}#review{height:100dvh;display:flex;flex-direction:column}header{display:flex;align-items:center;gap:18px;padding:10px 20px;border-bottom:1px solid #46534b;font-size:13px}header span{margin-right:auto}header a{color:#bfe5d0;text-decoration:underline;text-underline-offset:4px}header button{padding:8px 13px;background:#303b36;color:#f7f7f4;font-size:13px}iframe{width:100%;flex:1;border:0;min-height:0}[hidden]{display:none!important}@media(max-width:520px){main{padding:24px}header{padding:10px 12px;gap:12px}header span{font-size:12px}header a{font-size:12px}}
</style></head><body><main id="gate"><form><small>AUGUST / PRIVATE REVIEW</small><h1>Investor deck &amp;<br>brand direction.</h1><p>Enter the password shared with you to view the animated deck and download the submission.</p><label for="password">Review password</label><input id="password" type="password" required autocomplete="off" autocapitalize="off" spellcheck="false"><button type="submit">Open review</button><p id="status" role="status" aria-live="polite"></p></form></main><section id="review" hidden aria-label="Unlocked review"><header><span>August · Private review</span><a id="pdf" download="August-Case-Study-Submission.pdf">Download submission</a><button id="lock">Lock</button></header><iframe title="August animated investor deck" allow="fullscreen"></iframe></section><script>
const gate=document.querySelector('#gate'),review=document.querySelector('#review'),form=document.querySelector('form'),input=document.querySelector('#password'),status=document.querySelector('#status'),button=form.querySelector('button'),frame=document.querySelector('iframe');let pdfUrl;
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;status.textContent='Opening encrypted review…';let stage='download';try{
 if(!crypto.subtle||!window.DecompressionStream)throw Error('browser');
 const r=await fetch('review.enc.json',{cache:'no-store'});if(!r.ok)throw Error('network');const data=await r.json();stage='decrypt';
 const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(data.salt),iterations:data.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
 const decrypted=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(data.iv)},key,bytes(data.ciphertext));stage='render';const unpack=new Blob([decrypted]).stream().pipeThrough(new DecompressionStream('gzip'));const content=JSON.parse(await new Response(unpack).text());
 frame.srcdoc=content.html;pdfUrl=URL.createObjectURL(new Blob([bytes(content.pdf)],{type:'application/pdf'}));document.querySelector('#pdf').href=pdfUrl;input.value='';status.textContent='';gate.hidden=true;review.hidden=false;document.querySelector('#lock').focus();
 }catch(error){status.textContent=error.message==='browser'?'Please use a recent version of Safari, Chrome, Edge or Firefox.':stage==='decrypt'?'That password didn’t open the review. Check it and try again.':'The review could not load. Please check your connection and try again.';input.focus();}finally{button.disabled=false;}});
document.querySelector('#lock').addEventListener('click',()=>{frame.removeAttribute('srcdoc');if(pdfUrl)URL.revokeObjectURL(pdfUrl);document.querySelector('#pdf').removeAttribute('href');review.hidden=true;gate.hidden=false;input.focus();});
</script></body></html>
