name: Publish protected review
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: protected-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-slim
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare encrypted site only
        run: |
          mkdir public
          cp index.html review.enc.json .nojekyll public/
          mkdir -p public/draft-2
          cp draft-2/index.html draft-2/review.enc.json draft-2/.nojekyll public/draft-2/
          mkdir -p public/brand-preview
          cp brand-preview/index.html brand-preview/review.enc.json brand-preview/.nojekyll public/brand-preview/
          mkdir -p public/draft-3
          cp draft-3/index.html draft-3/review.enc.json draft-3/.nojekyll public/draft-3/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
